spring.security.oauth2.resourceserver.jwt.issuer-uri=${TASKFLOW_AUTH_ISSUER}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${TASKFLOW_AUTH_JWKS_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${TASKFLOW_AUTH_AUDIENCE}
